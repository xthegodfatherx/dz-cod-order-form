name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "Version:           $TAG" dz-cod-order-form.php || { echo "Plugin header version does not match tag $TAG"; exit 1; }
          grep -q "Stable tag: $TAG" readme.txt || { echo "readme.txt Stable tag does not match $TAG"; exit 1; }
      - name: Unit tests
        run: php tests/unit/run.php
      - name: Build zip (files in .distignore are left out)
        run: |
          mkdir -p build/dz-cod-order-form
          rsync -a --exclude-from=.distignore ./ build/dz-cod-order-form/
          cd build && zip -qr "dz-cod-order-form-${GITHUB_REF_NAME#v}.zip" dz-cod-order-form
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/*.zip --title "$GITHUB_REF_NAME" --generate-notes
