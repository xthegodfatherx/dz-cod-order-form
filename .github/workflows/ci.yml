name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: Lint + unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '7.4', '8.1', '8.3' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: JavaScript syntax
        run: node --check assets/form.js
      - name: Unit tests
        run: php tests/unit/run.php

  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer lint

  integration:
    name: WordPress ${{ matrix.wp }} + WooCommerce
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: [ 'latest' ]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: [ '3306:3306' ]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          extensions: mysqli
      - run: sudo apt-get update && sudo apt-get install -y subversion
      - run: composer install --no-progress --prefer-dist
      - name: Install WordPress test suite
        run: bash bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 ${{ matrix.wp }}
      - name: Install WooCommerce
        run: |
          curl -sSL -o /tmp/woocommerce.zip https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip
          unzip -q /tmp/woocommerce.zip -d /tmp/plugins
      - name: Integration tests
        env:
          WC_DIR: /tmp/plugins/woocommerce
        run: vendor/bin/phpunit
